<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Famiglia Zanole</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
input,textarea,select{font-size:16px!important;-webkit-text-size-adjust:100%}

:root{
  --primary:#E67E22;
  --primary-deep:#C86516;
  --primary-glow:#F29C4A;
  --bg:#4A0A0A;
  --off-white:#FDF3EA;
  --cream:#F5DCC0;
  --parchment:#EBB882;
  --green-sel:#1a5c2a;
  --green-light:#22c55e;
  --font-display:'Cormorant Garamond',Georgia,serif;
  --font-body:'Jost',sans-serif;
  --font-strong:'Barlow Condensed','Impact',sans-serif;
  --ease-out:cubic-bezier(0.25,0.46,0.45,0.94);
  --ease-io:cubic-bezier(0.4,0,0.2,1);
  --logo-size:132px;
  --logo-half:66px;
}

body{
  font-family:var(--font-body);
  background:var(--bg);
  color:var(--off-white);
  min-height:100dvh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}

body::before{
  content:'';position:fixed;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
  pointer-events:none;z-index:9999;opacity:0.4;
}

.hero-bg{
  position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(ellipse 80% 60% at 60% 20%,rgba(200,40,40,.30) 0%,transparent 60%),
    radial-gradient(ellipse 50% 40% at 10% 80%,rgba(120,15,15,.42) 0%,transparent 55%),
    linear-gradient(175deg,#4A0A0A 0%,#6E1212 35%,#8B1A1A 65%,#4A0A0A 100%);
}

/* ════════════════════════════════
   HOME
════════════════════════════════ */
#homeScreen{
  position:relative;z-index:1;
  min-height:100dvh;
  display:flex;flex-direction:column;
  padding:0 20px;
  max-width:520px;margin:0 auto;
  transition:opacity 280ms var(--ease-io),transform 280ms var(--ease-io);
}
#homeScreen.exiting{opacity:0;transform:translateY(-18px);pointer-events:none}

.cover-section{
  position:relative;height:205px;
  margin-left:-20px;margin-right:-20px;
  flex-shrink:0;overflow:hidden;
  clip-path:url(#coverClip);
}
.cover-img{
  position:absolute;inset:0;
  background-image:url('https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=1200&q=80');
  background-size:cover;background-position:center;opacity:.82;
}
.cover-vignette{
  position:absolute;inset:0;
  background:linear-gradient(to bottom,rgba(74,10,10,.18) 0%,rgba(60,8,8,.08) 40%,rgba(30,4,4,.55) 100%);
}

.profile-junction{
  position:relative;height:var(--logo-size);
  margin-top:calc(-1 * var(--logo-half));
  flex-shrink:0;z-index:2;
}
.bridge-svg{
  position:absolute;top:46px;left:-20px;
  width:calc(100% + 40px);height:20px;display:block;overflow:visible;
}
.bridge-base{fill:none;stroke:rgba(230,126,34,.45);stroke-width:.9;vector-effect:non-scaling-stroke}
.bridge-shine{
  fill:none;stroke:rgba(242,156,74,.82);stroke-width:1.5;stroke-linecap:round;
  stroke-dasharray:28 300;stroke-dashoffset:328;vector-effect:non-scaling-stroke;
  animation:bridge-shimmer 5s ease-in-out infinite;
}
@keyframes bridge-shimmer{
  0%,5%{stroke-dashoffset:328;opacity:0}11%{opacity:1}
  64%{opacity:.86;stroke-dashoffset:-28}74%,100%{stroke-dashoffset:-28;opacity:0}
}
.profile-logo{
  position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:var(--logo-size);height:var(--logo-size);border-radius:50%;
  background:radial-gradient(circle at 38% 34%,#6E1212 0%,#4A0A0A 52%,#2E0505 100%);
  border:2.5px solid rgba(230,126,34,.65);
  box-shadow:0 0 0 1.5px rgba(46,5,5,.92),0 8px 36px rgba(20,3,3,.72),inset 0 1px 0 rgba(253,243,234,.12);
  display:flex;align-items:center;justify-content:center;z-index:3;
}

.profile-name{font-family:var(--font-strong);font-size:34px;font-weight:800;color:var(--off-white);letter-spacing:.06em;line-height:1;margin-bottom:10px;text-transform:uppercase;text-align:center}
.profile-tagline{font-family:var(--font-body);font-size:14px;font-weight:400;line-height:1.65;color:#FFF;letter-spacing:.02em;text-align:center}
.profile-tagline em{font-style:normal;color:var(--off-white);font-weight:500}
.profile-identity{padding:18px 0 0;margin-bottom:6px;flex-shrink:0}

.divider{display:flex;align-items:center;gap:14px;margin:14px 0}
.divider-line{flex:1;height:1px;background:linear-gradient(90deg,rgba(230,126,34,.6),rgba(92,34,8,.2));position:relative;overflow:hidden}
.divider-gem{width:5px;height:5px;background:var(--primary-glow);transform:rotate(45deg);opacity:.7;flex-shrink:0;animation:gem-pulse 5s ease-in-out infinite}
@keyframes gem-pulse{
  0%,52%{opacity:.7;transform:rotate(45deg) scale(1)}
  65%{opacity:1;transform:rotate(45deg) scale(1.45);filter:brightness(1.5)}
  92%,100%{opacity:.7;transform:rotate(45deg) scale(1);filter:brightness(1)}
}

.home-ctas{display:flex;flex-direction:column;gap:12px}

.insta-btn{
  position:relative;display:flex;align-items:center;gap:14px;padding:0 20px;
  background:linear-gradient(135deg,#833AB4 0%,#C13584 45%,#E1306C 75%,#F77737 100%);
  border:none;border-radius:4px;cursor:pointer;overflow:hidden;
  text-decoration:none;height:56px;width:100%;
  transition:transform 80ms;-webkit-tap-highlight-color:transparent;
  box-shadow:0 2px 16px rgba(193,53,132,.35);
}
.insta-btn:active{transform:scale(.976)}
.insta-label{flex:1;text-align:left}
.insta-role{font-size:9.5px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,240,250,.80);margin-bottom:2px}
.insta-name{font-size:14px;font-weight:500;color:rgba(255,240,250,.95);letter-spacing:.06em}

.order-btn{
  width:100%;padding:20px 24px;min-height:60px;
  background:#E67E22;border:1.5px solid rgba(255,200,140,.50);border-radius:4px;
  font-family:var(--font-body);font-size:12px;font-weight:700;letter-spacing:.18em;
  text-transform:uppercase;color:#FFF;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:10px;
  box-shadow:0 4px 24px rgba(230,126,34,.55);
  -webkit-tap-highlight-color:transparent;position:relative;overflow:hidden;
  transition:background 180ms,transform 80ms;
}
.order-btn::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,200,140,.18) 0%,transparent 55%);pointer-events:none}
.order-btn:hover{background:#F08C32}
.order-btn:active{transform:scale(.976);background:#C86516}

.home-footer{padding:16px 0 28px;display:flex;align-items:center;justify-content:space-between;opacity:.38}
.footer-text{font-size:9px;font-weight:400;letter-spacing:.16em;text-transform:uppercase;color:var(--parchment)}

.anim{animation:fadeUp 600ms var(--ease-out) both}
.d1{animation-delay:60ms}.d2{animation-delay:160ms}.d3{animation-delay:240ms}
.d4{animation-delay:330ms}.d5{animation-delay:420ms}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

/* ════════════════════════════════
   CONV SCREEN
════════════════════════════════ */
#convScreen{
  position:fixed;inset:0;z-index:200;
  display:flex;flex-direction:column;
  background:#0f0404;
  transform:translateY(100%);
  transition:transform 400ms var(--ease-out);
  overflow:hidden;
}
#convScreen.visible{transform:translateY(0)}

.conv-head{
  flex-shrink:0;
  z-index:10;
  background:rgba(15,4,4,.98);
  backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(230,126,34,.18);
}
.conv-head-inner{
  max-width:640px;margin:0 auto;padding:0 16px;
  height:56px;display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.conv-brand{display:flex;align-items:center;gap:10px;cursor:pointer}
.conv-logo{
  width:32px;height:32px;border-radius:50%;
  background:radial-gradient(circle at 38% 34%,#6E1212 0%,#2E0505 70%);
  border:1.5px solid rgba(230,126,34,.65);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-size:14px;font-weight:600;font-style:italic;color:var(--off-white);
}
.conv-brand-name{font-family:var(--font-display);font-size:17px;font-weight:600;font-style:italic;color:var(--off-white);line-height:1}
.conv-brand-status{font-size:10px;font-weight:500;color:rgba(242,156,74,.7);letter-spacing:.04em}
.conv-progbar{width:90px;height:2px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden}
.conv-progfill{height:100%;background:var(--primary-glow);border-radius:2px;transition:width .5s var(--ease-io)}

.conv-scroll{
  flex:1 1 0;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  padding-bottom:8px;
}
.conv-stage{
  max-width:640px;margin:0 auto;
  padding:24px 16px 16px;
  display:flex;flex-direction:column;
}

.msg{
  display:flex;align-items:flex-start;gap:10px;
  margin-bottom:12px;
  animation:msgIn .38s cubic-bezier(.2,.7,.2,1) both;
}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg-avatar{
  width:32px;height:32px;border-radius:50%;flex-shrink:0;
  background:radial-gradient(circle at 38% 34%,#6E1212 0%,#2E0505 70%);
  border:1.5px solid rgba(230,126,34,.65);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-size:13px;font-weight:600;font-style:italic;color:var(--off-white);
  margin-top:2px;flex-shrink:0;
}
.msg-bubble{
  max-width:72ch;padding:11px 15px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.10);
  border-radius:4px 16px 16px 16px;
  font-size:15px;line-height:1.6;color:rgba(255,255,255,.88);
}
.msg-bubble strong{color:#fff;font-weight:700}
.msg-bubble em{font-style:italic;color:var(--primary-glow)}

.typing{display:flex;align-items:center;gap:10px;margin-bottom:12px;animation:msgIn .3s ease both}
.typing-dots{
  display:flex;gap:4px;align-items:center;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.10);
  padding:10px 14px;border-radius:16px;
}
.typing-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.3);animation:dotPulse 1.2s ease-in-out infinite}
.typing-dot:nth-child(2){animation-delay:.2s}
.typing-dot:nth-child(3){animation-delay:.4s}
@keyframes dotPulse{0%,80%,100%{transform:scale(.8);opacity:.4}40%{transform:scale(1.1);opacity:1}}

.user-msg{display:flex;justify-content:flex-end;margin-bottom:12px;animation:msgIn .3s ease both}
.user-bubble{
  max-width:72ch;padding:10px 15px;
  background:var(--primary-deep);
  border-radius:16px 4px 16px 16px;
  font-size:14px;line-height:1.55;color:#fff;font-weight:500;
}

.inline-block{
  margin-bottom:16px;
  animation:msgIn .38s cubic-bezier(.2,.7,.2,1) both;
}

.answer-area{
  flex-shrink:0;
  z-index:50;
  background:rgba(10,4,4,.98);
  backdrop-filter:blur(20px);
  border-top:1px solid rgba(230,126,34,.15);
  padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));
}
.answer-inner{
  max-width:640px;margin:0 auto;
  display:flex;flex-direction:column;gap:8px;
}
.answer-hint{
  font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:rgba(255,255,255,.28);
}

.input-row{display:flex;gap:10px;align-items:flex-end}
.text-input{
  flex:1;padding:11px 14px;
  background:rgba(255,255,255,.07);
  border:1.5px solid rgba(255,255,255,.14);
  border-radius:10px;color:#fff;
  font-family:var(--font-body);font-size:16px;
  outline:none;transition:border-color .18s,background .18s;
  resize:none;line-height:1.5;
}
.text-input::placeholder{color:rgba(255,255,255,.25)}
.text-input:focus{border-color:rgba(230,126,34,.55);background:rgba(255,255,255,.09)}
.send-btn{
  width:44px;height:44px;border-radius:10px;
  background:var(--primary);border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:background .15s,transform .12s;
  box-shadow:0 4px 12px rgba(230,126,34,.4);
}
.send-btn:hover{background:var(--primary-glow)}
.send-btn:active{transform:scale(.93)}

.continue-btn{
  align-self:flex-start;
  display:inline-flex;align-items:center;gap:8px;
  padding:11px 20px;
  background:linear-gradient(105deg,#C86516 0%,#E67E22 30%,#F29C4A 52%,#E67E22 72%,#C86516 100%);
  background-size:250% 100%;background-position:100% 0;
  border:1px solid rgba(253,243,234,.28);border-radius:6px;
  font-family:var(--font-body);font-size:13px;font-weight:700;
  color:#fff;cursor:pointer;
  transition:background-position .5s ease,transform .12s,opacity .2s;
  box-shadow:0 4px 14px rgba(230,126,34,.38);
  -webkit-tap-highlight-color:transparent;
}
.continue-btn:hover{background-position:0% 0}
.continue-btn:active{transform:scale(.97)}

/* ════════════════════════════════
   CARROSSEL — estrutura
════════════════════════════════ */
.carousel-section{margin-bottom:14px}
.carousel-label{
  font-size:9px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;
  color:var(--primary-glow);margin-bottom:10px;
  padding-left:42px;
}
.carousel{
  display:flex;gap:12px;
  overflow-x:auto;overflow-y:visible;
  scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;
  padding:4px 16px 14px 42px;
  scrollbar-width:none;
  box-sizing:border-box;
  width:100%;
}
.carousel::-webkit-scrollbar{display:none}

/* ════════════════════════════════
   PRODUCT CARD — REDESIGN COMPLETO
   Inspirado em iFood/Rappi — profissional
════════════════════════════════ */
.product-card{
  scroll-snap-align:start;
  flex:0 0 152px;
  background:#1C0808;
  border:1.5px solid rgba(255,255,255,.10);
  border-radius:14px;
  overflow:hidden;
  cursor:pointer;
  transition:border-color .2s,transform .15s,box-shadow .2s;
  -webkit-tap-highlight-color:transparent;
  position:relative;
  box-shadow:0 4px 16px rgba(0,0,0,.45);
  display:flex;
  flex-direction:column;
}
.product-card:active{transform:scale(.96);box-shadow:0 2px 8px rgba(0,0,0,.5)}
.product-card.sel{
  border-color:var(--green-light);
  box-shadow:0 0 0 2px rgba(34,197,94,.28), 0 4px 20px rgba(34,197,94,.15);
}

/* Check badge */
.card-check{
  position:absolute;top:8px;right:8px;
  width:22px;height:22px;border-radius:50%;
  background:var(--green-sel);border:2px solid var(--green-light);
  display:none;align-items:center;justify-content:center;z-index:3;
  box-shadow:0 2px 8px rgba(34,197,94,.4);
}
.product-card.sel .card-check{display:flex}

/* Imagem do produto */
.card-img-wrap{
  position:relative;
  width:100%;
  height:100px;
  overflow:hidden;
  flex-shrink:0;
}
.card-img{
  width:100%;height:100%;
  object-fit:cover;
  display:block;
  transition:transform .35s ease;
}
.product-card:hover .card-img{transform:scale(1.06)}
.card-img-placeholder{
  width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#2A0A0A 0%,#3D1010 50%,#1E0606 100%);
  font-size:38px;
  position:relative;
}
.card-img-placeholder::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(230,126,34,.08) 0%,transparent 60%);
}
/* Overlay escuro na base da imagem — melhora leitura */
.card-img-wrap::after{
  content:'';position:absolute;bottom:0;left:0;right:0;
  height:36px;
  background:linear-gradient(to top,rgba(28,8,8,.9) 0%,transparent 100%);
  pointer-events:none;z-index:1;
}

/* Badge de categoria/tag */
.card-badge{
  position:absolute;top:7px;left:7px;
  background:rgba(230,126,34,.92);
  color:#fff;font-size:9px;font-weight:700;letter-spacing:.08em;
  padding:2px 7px;border-radius:100px;
  text-transform:uppercase;z-index:2;
  backdrop-filter:blur(4px);
}

/* Botão de detalhes — ícone info */
.card-detail-btn{
  position:absolute;bottom:7px;right:7px;
  width:22px;height:22px;border-radius:50%;
  background:rgba(0,0,0,.55);
  border:1px solid rgba(255,255,255,.2);
  display:flex;align-items:center;justify-content:center;
  z-index:3;cursor:pointer;
  backdrop-filter:blur(4px);
  transition:background .15s,transform .1s;
  -webkit-tap-highlight-color:transparent;
}
.card-detail-btn:hover{background:rgba(230,126,34,.7)}
.card-detail-btn:active{transform:scale(.9)}

/* Corpo do card */
.card-body{
  padding:9px 10px 11px;
  display:flex;flex-direction:column;gap:3px;
  flex:1;
  background:#1C0808;
}
.card-name{
  font-family:var(--font-body);
  font-size:12.5px;font-weight:700;
  color:#fff;line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.card-desc{
  font-size:10.5px;color:rgba(255,255,255,.42);
  line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.card-footer{
  display:flex;align-items:center;justify-content:space-between;
  margin-top:auto;padding-top:7px;
}
.card-price{
  font-family:var(--font-strong);
  font-size:15px;font-weight:700;
  color:var(--primary-glow);
  letter-spacing:.02em;
  line-height:1;
}
.card-price-label{
  font-size:9px;color:rgba(255,255,255,.3);font-weight:500;
  letter-spacing:.06em;margin-bottom:1px;
}

/* chips de variante */
.variants-row{
  display:flex;flex-wrap:wrap;gap:6px;
  padding:4px 42px 6px;
}
.variant-chip{
  display:inline-flex;align-items:center;gap:4px;
  padding:5px 11px;border-radius:100px;
  background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.14);
  font-size:12px;font-weight:600;color:rgba(255,255,255,.75);
  cursor:pointer;transition:all .18s;-webkit-tap-highlight-color:transparent;
}
.variant-chip:active{opacity:.8}
.variant-chip.sel{background:rgba(26,92,42,.35);border-color:var(--green-light);color:#4ade80}

/* barra de selecionados */
.sel-bar{
  display:none;
  margin:4px 42px 0;
  background:rgba(26,92,42,.15);
  border:1px solid rgba(34,197,94,.2);
  border-radius:8px;padding:7px 11px;
}
.sel-bar.on{display:block}
.sel-bar-label{font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#4ade80;margin-bottom:5px}
.sel-chips{display:flex;flex-wrap:wrap;gap:4px}
.sel-chip{
  display:inline-flex;align-items:center;gap:4px;
  padding:2px 9px;border-radius:100px;
  background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.25);
  font-size:12px;font-weight:600;color:#fff;
}
.sel-chip-x{cursor:pointer;font-size:14px;font-weight:700;opacity:.55;line-height:1}
.sel-chip-x:hover{opacity:1}

/* ════════════════════════════════
   MODAL DE DETALHES DO PRODUTO
════════════════════════════════ */
.product-modal-overlay{
  position:fixed;inset:0;z-index:500;
  background:rgba(10,2,2,.72);
  backdrop-filter:blur(6px);
  display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;
  transition:opacity .25s ease;
}
.product-modal-overlay.open{opacity:1;pointer-events:all}

.product-modal{
  width:100%;max-width:520px;
  background:#1A0606;
  border-radius:20px 20px 0 0;
  border:1.5px solid rgba(230,126,34,.22);
  border-bottom:none;
  overflow:hidden;
  transform:translateY(100%);

let _modalItem=null, _modalCat=null;

function openModal(item, cat){
  _modalItem=item; _modalCat=cat;
  const overlay=document.getElementById('productModalOverlay');
  const content=document.getElementById('modalContent');

  const isAdded = !!st.sel[cat][item.id] || 
    (item.variants && Object.keys(st.sel[cat]).some(k=>k.startsWith(item.id+'::')));

  let imgHtml = item.img
    ? `<img class="modal-img" src="${item.img}" alt="${esc(item.name)}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
    : '';

  content.innerHTML=`
    <div class="modal-img-wrap">
      ${imgHtml}
      <div class="modal-img-placeholder" ${item.img?'style="display:none"':''}>🍽️</div>
    </div>
    <div class="modal-body">
      <div class="modal-name">${esc(item.name)}</div>
      <div class="modal-price">${esc(item.price)}</div>
      <div class="modal-desc">${esc(item.details||item.desc)}</div>
      ${item.ingredients&&item.ingredients.length?`
        <div class="modal-section-title">Ingredientes</div>
        <div class="modal-ingredients">
          ${item.ingredients.map(i=>`<span class="modal-ingredient">${esc(i)}</span>`).join('')}
        </div>
      `:''}
      ${item.variants?`
        <div class="modal-section-title">Tamanhos disponíveis</div>
        <div class="modal-ingredients">
          ${item.variants.map(({v})=>`<span class="modal-ingredient">${esc(v)}</span>`).join('')}
        </div>
      `:''}
      <button class="modal-add-btn ${isAdded?'added':''}" id="modalAddBtn" onclick="modalToggleItem()">
        ${isAdded
          ? '<svg viewBox="0 0 16 16" fill="none" width="15" height="15"><path d="M3 8l3.5 3.5L13 4.5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg> Adicionado ao pedido'
          : '<svg viewBox="0 0 16 16" fill="none" width="15" height="15"><path d="M8 3v10M3 8h10" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg> Adicionar ao pedido'
        }
      </button>
    </div>
  `;

  overlay.classList.add('open');
  document.body.style.overflow='hidden';
}

function modalToggleItem(){
  if(!_modalItem||!_modalCat) return;
  const item=_modalItem, cat=_modalCat;
  const btn=document.getElementById('modalAddBtn');

  if(!item.variants){
    const key=item.id;
    if(st.sel[cat][key]){
      delete st.sel[cat][key];
      const c=document.getElementById('card-'+item.id);
      if(c) c.classList.remove('sel');
      btn.className='modal-add-btn';
      btn.innerHTML='<svg viewBox="0 0 16 16" fill="none" width="15" height="15"><path d="M8 3v10M3 8h10" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg> Adicionar ao pedido';
    } else {
      st.sel[cat][key]={label:item.name};
      const c=document.getElementById('card-'+item.id);
      if(c) c.classList.add('sel');
      btn.className='modal-add-btn added';
      btn.innerHTML='<svg viewBox="0 0 16 16" fill="none" width="15" height="15"><path d="M3 8l3.5 3.5L13 4.5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg> Adicionado ao pedido';
    }
    updateSelBar(cat);
    showToast(st.sel[cat][item.id]?'Adicionado! ✓':'Removido do pedido');
  } else {
    closeModalBtn();
    showToast('Escolha o tamanho nos chips abaixo ☝️');
  }
}

function closeModal(e){
  if(e.target===document.getElementById('productModalOverlay')) closeModalBtn();
}
function closeModalBtn(){
  document.getElementById('productModalOverlay').classList.remove('open');
  document.body.style.overflow='hidden'; // mantém conv scroll bloqueado
}

function showTyping(){
  removeTyping();
  const el=document.createElement('div'); el.id='typingDots'; el.className='typing';
  el.innerHTML=`<div class="msg-avatar">Z</div><div class="typing-dots"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>`;
  stage().appendChild(el); scrollBottom();
}
function removeTyping(){ const el=document.getElementById('typingDots'); if(el)el.remove(); }

function addBot(html){
  removeTyping();
  const w=document.createElement('div'); w.className='msg';
  w.innerHTML=`<div class="msg-avatar">Z</div><div class="msg-bubble">${html}</div>`;
  stage().appendChild(w); scrollBottom();
}

function addUser(text){
  const el=document.createElement('div'); el.className='user-msg';
  el.innerHTML=`<div class="user-bubble">${esc(text)}</div>`;
  stage().appendChild(el); scrollBottom();
}

function addInline(buildFn){
  const el=document.createElement('div'); el.className='inline-block';
  buildFn(el);
  stage().appendChild(el); scrollBottom();
  return el;
}

function send(msgs, done){
  let t=0;
  msgs.forEach((m,i)=>{
    const delay=m.delay||0;
    if(i>0) setTimeout(()=>showTyping(), delay);
    const at=delay+(i>0?800:0);
    t=at+200;
    setTimeout(()=>addBot(m.html), at);
  });
  setTimeout(()=>done&&done(), t+80);
}

function renderAnswer(buildFn){
  const inner=document.getElementById('answerInner');
  inner.innerHTML='';
  buildFn(inner);
  const area=document.getElementById('answerArea');
  area.style.display='';
  area.style.opacity='1';
  area.style.pointerEvents='auto';
  scrollBottom();
}
function clearAnswer(){
  const area=document.getElementById('answerArea');
  area.style.opacity='0';
  area.style.pointerEvents='none';
  setTimeout(()=>{ area.style.display='none'; document.getElementById('answerInner').innerHTML=''; },180);
}

function stage(){ return document.getElementById('convStage'); }
function scrollBottom(){
  setTimeout(()=>{
    const sc=document.getElementById('convScroll');
    if(sc) sc.scrollTo({top:sc.scrollHeight,behavior:'smooth'});
  },60);
}

function startFlow(){
  prog(5);

    {html:'Olá! Seja muito bem-vindo(a) à <strong>Famiglia Zanole</strong> 🍔✨', delay:0},
    {html:'Estou aqui para montar seu pedido com cuidado. Vai levar só alguns minutinhos!', delay:1100},

  ], ()=>{
    renderAnswer(inner=>{
      const hint=document.createElement('div'); hint.className='answer-hint'; hint.textContent='Digite seu nome'; inner.appendChild(hint);
      const row=document.createElement('div'); row.className='input-row';
      const inp=document.createElement('textarea');
      inp.className='text-input'; inp.placeholder='Ex: João, Maria...'; inp.rows=1; inp.id='nomeInp';
      inp.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submitNome();} });
      const btn=document.createElement('button'); btn.className='send-btn';
      btn.innerHTML=`<svg viewBox="0 0 18 18" fill="none" width="17" height="17"><path d="M2 9l14-7-7 14V9H2z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>`;
      btn.onclick=submitNome;
      row.appendChild(inp); row.appendChild(btn); inner.appendChild(row);
      setTimeout(()=>inp.focus(),300);

  });
}

function submitNome(){
  const inp=document.getElementById('nomeInp');
  const val=inp?inp.value.trim():'';
  if(!val){if(inp)inp.focus();return;}
  st.nome=val; addUser(val); clearAnswer(); prog(15);
  setTimeout(()=>{
    send([
      {html:`Prazer, <strong>${esc(fn())}</strong>! 😄`, delay:0},

    {html:`Perfeito, <strong>${esc(fn())}</strong>! 🎉 Confira o resumo do seu pedido:`, delay:0},
  ], ()=>{

      rows.push({k:'Cliente',v:st.nome});
      const p=Object.values(st.sel.principal);
      if(p.length) rows.push({k:'Principal',v:p.map(s=>s.label).join('\n')});
      const a=Object.values(st.sel.acompanhamentos);
      if(a.length) rows.push({k:'Acompanha',v:a.map(s=>s.label).join('\n')});
      const s=Object.values(st.sel.sobremesas);
      if(s.length) rows.push({k:'Sobremesa',v:s.map(s=>s.label).join('\n')});
      const b=Object.values(st.sel.bebidas);
      if(b.length) rows.push({k:'Bebida',v:b.map(s=>s.label).join('\n')});
      rows.push({k:'Recebimento',v:st.delivery==='entrega'?'Entrega':'Retirada no local'});
      if(st.delivery==='entrega'&&st.address) rows.push({k:'Endereço',v:st.address+(st.addrRef?' — '+st.addrRef:'')});

      ed.textContent='✏️ Editar pedido';

        el.style.display='none';
        st.sel={principal:{},acompanhamentos:{},sobremesas:{},bebidas:{}};
        st.delivery=''; st.payment='';
        setTimeout(()=>{ send([{html:'Sem problema! Vamos recomeçar 😊 Escolha o principal:', delay:0}], ()=>stepPrincipal()); },300);

}

/* ════════════════════════════════
   CARROSSEL — buildCarousel REDESENHADO
════════════════════════════════ */
function buildCarousel(container, cat, sections){
  sections.forEach(section=>{
    const sec=document.createElement('div'); sec.className='carousel-section';

    const lbl=document.createElement('div'); lbl.className='carousel-label';
    lbl.textContent=section.title;
    sec.appendChild(lbl);

    const car=document.createElement('div'); car.className='carousel';

    section.items.forEach(item=>{
      const card=document.createElement('div');
      card.className='product-card'; card.id='card-'+item.id;

      /* Imagem ou placeholder */
      const imgHtml = item.img
        ? `<img class="card-img" src="${item.img}" alt="${esc(item.name)}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
        : '';
      const placeholderStyle = item.img ? 'style="display:none"' : '';
      /* emoji fallback genérico por categoria */
      const fallbackEmoji = {principal:'🍔',acompanhamentos:'🍟',sobremesas:'🍰',bebidas:'🥤'}[cat]||'🍽️';

      card.innerHTML=`
        <div class="card-check">
          <svg width="10" height="10" viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-5" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="card-img-wrap">
          ${imgHtml}
          <div class="card-img-placeholder" ${placeholderStyle}>${fallbackEmoji}</div>
          ${section.badge?`<div class="card-badge">${esc(section.badge)}</div>`:''}
          <button class="card-detail-btn" title="Ver detalhes" aria-label="Ver detalhes de ${esc(item.name)}">
            <svg width="11" height="11" viewBox="0 0 12 12" fill="none">
              <circle cx="6" cy="6" r="5" stroke="rgba(255,255,255,.8)" stroke-width="1.2"/>
              <path d="M6 5.5v3M6 4h.01" stroke="rgba(255,255,255,.8)" stroke-width="1.3" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
        <div class="card-body">
          <div class="card-name">${esc(item.name)}</div>
          <div class="card-desc">${esc(item.desc)}</div>
          <div class="card-footer">
            <div>
              ${item.variants?'<div class="card-price-label">A partir de</div>':''}
              <div class="card-price">${esc(item.price)}</div>
            </div>
          </div>
        </div>`;

      /* Botão de detalhes — stopPropagation para não ativar seleção */
      const detailBtn=card.querySelector('.card-detail-btn');
      detailBtn.addEventListener('click', e=>{ e.stopPropagation(); openModal(item, cat); });

      /* Toque no card = selecionar (se sem variante) ou abrir modal */
      if(!item.variants){
        card.addEventListener('click', ()=>toggleItem(cat,item));
      } else {
        /* card com variante: toque abre modal (que mostra tamanhos) */
        card.addEventListener('click', ()=>openModal(item,cat));
      }

      car.appendChild(card);
    });

    sec.appendChild(car);

    /* variantes e sel-bar */
    section.items.forEach(item=>{
      if(!item.variants) return;
      const vrow=document.createElement('div'); vrow.className='variants-row'; vrow.id='vrow-'+item.id;
      item.variants.forEach(({v})=>{
        const chip=document.createElement('div'); chip.className='variant-chip';
        const key=item.id+'::'+v;
        chip.textContent=v;
        chip.setAttribute('data-key',key);
        chip.onclick=()=>{
          if(st.sel[cat][key]){
            delete st.sel[cat][key]; chip.classList.remove('sel');
          } else {
            st.sel[cat][key]={ label:item.name+' ('+v+')' };
            chip.classList.add('sel');
          }
          const hasAny=Object.keys(st.sel[cat]).some(k=>k.startsWith(item.id+'::'));
          const c=document.getElementById('card-'+item.id);
          if(c) c.classList.toggle('sel',hasAny);
          updateSelBar(cat);
        };
        vrow.appendChild(chip);
      });
      sec.appendChild(vrow);
    });

    const bar=document.createElement('div'); bar.className='sel-bar'; bar.id='selbar-'+cat+'-'+section.key;
    bar.innerHTML=`<div class="sel-bar-label">Selecionados</div><div class="sel-chips" id="selchips-${cat}-${section.key}"></div>`;
    sec.appendChild(bar);

    container.appendChild(sec);
  });
  updateSelBar(cat);
}

function toggleItem(cat,item){
  const key=item.id;
  const c=document.getElementById('card-'+item.id);
  if(st.sel[cat][key]){ delete st.sel[cat][key]; if(c)c.classList.remove('sel'); }
  else { st.sel[cat][key]={label:item.name}; if(c)c.classList.add('sel'); }
  updateSelBar(cat);
}

function updateSelBar(cat){
  const entries=Object.entries(st.sel[cat]);
  document.querySelectorAll('[id^="selbar-'+cat+'-"]').forEach(bar=>{
    const key=bar.id.replace('selbar-'+cat+'-','');
    const chipsEl=document.getElementById('selchips-'+cat+'-'+key);
    if(!chipsEl) return;
    bar.classList.toggle('on', entries.length>0);
    chipsEl.innerHTML=entries.map(([k,v])=>
      `<div class="sel-chip">${esc(v.label)}<span class="sel-chip-x" onclick="removeItem('${esc(cat)}','${escAttr(k)}')">×</span></div>`
    ).join('');
  });
}

function removeItem(cat,key){
  delete st.sel[cat][key];
  const isVar=key.includes('::');
  const itemId=isVar?key.split('::')[0]:key;
  if(isVar){
    const chip=document.querySelector(`[data-key="${key}"]`);
    if(chip) chip.classList.remove('sel');
    const hasAny=Object.keys(st.sel[cat]).some(k=>k.startsWith(itemId+'::'));
    const c=document.getElementById('card-'+itemId);
    if(c) c.classList.toggle('sel',hasAny);
  } else {
    const c=document.getElementById('card-'+itemId);
    if(c) c.classList.remove('sel');
  }
  updateSelBar(cat);
}

function lock(id){
  const el=document.getElementById(id);
  if(el){el.style.pointerEvents='none';el.style.opacity='.55';}
}

/* ════════════════════════════════
   WHATSAPP
════════════════════════════════ */
function sendWA(){
  const payL={pix:'PIX',cartao:'Cartão',dinheiro:'Dinheiro'};
  let msg=`Olá, Famiglia Zanole! 🍔\n\nMeu nome é *${st.nome}* e gostaria de fazer um pedido.\n`;
  const p=Object.values(st.sel.principal);
  if(p.length) msg+=`\n*🍔 Principal:*\n${p.map(s=>'• '+s.label).join('\n')}`;
  const a=Object.values(st.sel.acompanhamentos);
  if(a.length) msg+=`\n\n*🍟 Acompanhamentos:*\n${a.map(s=>'• '+s.label).join('\n')}`;
  const s=Object.values(st.sel.sobremesas);
  if(s.length) msg+=`\n\n*🍰 Sobremesas:*\n${s.map(s=>'• '+s.label).join('\n')}`;
  const b=Object.values(st.sel.bebidas);
  if(b.length) msg+=`\n\n*🥤 Bebidas:*\n${b.map(s=>'• '+s.label).join('\n')}`;
  if(st.delivery==='entrega'){
    msg+=`\n\n*📦 Recebimento:* Entrega\n*Endereço:* ${st.address}`;
    if(st.addrRef) msg+=`\n*Referência:* ${st.addrRef}`;
  } else {
    msg+=`\n\n*📦 Recebimento:* Retirada no local`;
  }
  msg+=`\n\n*💳 Pagamento:* ${payL[st.payment]}`;
  window.open(`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}`,'_blank');
  closeConv();
}

/* ════════════════════════════════
   UTILS
════════════════════════════════ */
function fn(){ return st.nome.split(' ')[0]; }
function esc(s){ if(!s)return''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escAttr(s){ return esc(s).replace(/'/g,'&#39;'); }

const toastEl=document.getElementById('toast');
let toastT;
function showToast(msg){
  toastEl.textContent=msg; toastEl.classList.add('on');
  clearTimeout(toastT); toastT=setTimeout(()=>toastEl.classList.remove('on'),2400);
}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(document.getElementById('productModalOverlay').classList.contains('open')) closeModalBtn();
    else if(document.getElementById('convScreen').classList.contains('visible')) closeConv();
  }
});
</script>
