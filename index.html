<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Famiglia Zanole</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
input,textarea,select{font-size:16px!important;-webkit-text-size-adjust:100%}

:root{
  --primary:#E67E22;
  --primary-deep:#C86516;
  --primary-glow:#F29C4A;
  --bg:#4A0A0A;
  --off-white:#FDF3EA;
  --cream:#F5DCC0;
  --parchment:#EBB882;
  --green-sel:#1a5c2a;
  --green-light:#22c55e;
  --font-display:'Cormorant Garamond',Georgia,serif;
  --font-body:'Jost',sans-serif;
  --font-strong:'Barlow Condensed','Impact',sans-serif;
  --ease-out:cubic-bezier(0.25,0.46,0.45,0.94);
  --ease-io:cubic-bezier(0.4,0,0.2,1);
  --logo-size:132px;
  --logo-half:66px;
}

body{
  font-family:var(--font-body);
  background:var(--bg);
  color:var(--off-white);
  min-height:100dvh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}

body::before{
  content:'';position:fixed;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
  pointer-events:none;z-index:9999;opacity:0.4;
}

.hero-bg{
  position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(ellipse 80% 60% at 60% 20%,rgba(200,40,40,.30) 0%,transparent 60%),
    radial-gradient(ellipse 50% 40% at 10% 80%,rgba(120,15,15,.42) 0%,transparent 55%),
    linear-gradient(175deg,#4A0A0A 0%,#6E1212 35%,#8B1A1A 65%,#4A0A0A 100%);
}

/* HOME */
#homeScreen{
  position:relative;z-index:1;
  min-height:100dvh;
  display:flex;flex-direction:column;
  padding:0 20px;
  max-width:520px;margin:0 auto;
  transition:opacity 280ms var(--ease-io),transform 280ms var(--ease-io);
}
#homeScreen.exiting{opacity:0;transform:translateY(-18px);pointer-events:none}

.cover-section{
  position:relative;height:205px;
  margin-left:-20px;margin-right:-20px;
  flex-shrink:0;overflow:hidden;
  clip-path:url(#coverClip);
}
.cover-img{
  position:absolute;inset:0;
  background-image:url('https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=1200&q=80');
  background-size:cover;background-position:center;opacity:.82;
}
.cover-vignette{
  position:absolute;inset:0;
  background:linear-gradient(to bottom,rgba(74,10,10,.18) 0%,rgba(60,8,8,.08) 40%,rgba(30,4,4,.55) 100%);
}

.profile-junction{
  position:relative;height:var(--logo-size);
  margin-top:calc(-1 * var(--logo-half));
  flex-shrink:0;z-index:2;
}
.bridge-svg{
  position:absolute;top:46px;left:-20px;
  width:calc(100% + 40px);height:20px;display:block;overflow:visible;
}
.bridge-base{fill:none;stroke:rgba(230,126,34,.45);stroke-width:.9;vector-effect:non-scaling-stroke}
.bridge-shine{
  fill:none;stroke:rgba(242,156,74,.82);stroke-width:1.5;stroke-linecap:round;
  stroke-dasharray:28 300;stroke-dashoffset:328;vector-effect:non-scaling-stroke;
  animation:bridge-shimmer 5s ease-in-out infinite;
}
@keyframes bridge-shimmer{
  0%,5%{stroke-dashoffset:328;opacity:0}11%{opacity:1}
  64%{opacity:.86;stroke-dashoffset:-28}74%,100%{stroke-dashoffset:-28;opacity:0}
}
.profile-logo{
  position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:var(--logo-size);height:var(--logo-size);border-radius:50%;
  background:radial-gradient(circle at 38% 34%,#6E1212 0%,#4A0A0A 52%,#2E0505 100%);
  border:2.5px solid rgba(230,126,34,.65);
  box-shadow:0 0 0 1.5px rgba(46,5,5,.92),0 8px 36px rgba(20,3,3,.72),inset 0 1px 0 rgba(253,243,234,.12);
  display:flex;align-items:center;justify-content:center;z-index:3;
}

.profile-name{font-family:var(--font-strong);font-size:34px;font-weight:800;color:var(--off-white);letter-spacing:.06em;line-height:1;margin-bottom:10px;text-transform:uppercase;text-align:center}
.profile-tagline{font-family:var(--font-body);font-size:14px;font-weight:400;line-height:1.65;color:#FFF;letter-spacing:.02em;text-align:center}
.profile-tagline em{font-style:normal;color:var(--off-white);font-weight:500}
.profile-identity{padding:18px 0 0;margin-bottom:6px;flex-shrink:0}

.divider{display:flex;align-items:center;gap:14px;margin:14px 0}
.divider-line{flex:1;height:1px;background:linear-gradient(90deg,rgba(230,126,34,.6),rgba(92,34,8,.2));position:relative;overflow:hidden}
.divider-gem{width:5px;height:5px;background:var(--primary-glow);transform:rotate(45deg);opacity:.7;flex-shrink:0;animation:gem-pulse 5s ease-in-out infinite}
@keyframes gem-pulse{
  0%,52%{opacity:.7;transform:rotate(45deg) scale(1)}
  65%{opacity:1;transform:rotate(45deg) scale(1.45);filter:brightness(1.5)}
  92%,100%{opacity:.7;transform:rotate(45deg) scale(1);filter:brightness(1)}
}

.home-ctas{display:flex;flex-direction:column;gap:12px}

.insta-btn{
  position:relative;display:flex;align-items:center;gap:14px;padding:0 20px;
  background:linear-gradient(135deg,#833AB4 0%,#C13584 45%,#E1306C 75%,#F77737 100%);
  border:none;border-radius:4px;cursor:pointer;overflow:hidden;
  text-decoration:none;height:56px;width:100%;
  transition:transform 80ms;-webkit-tap-highlight-color:transparent;
  box-shadow:0 2px 16px rgba(193,53,132,.35);
}
.insta-btn:active{transform:scale(.976)}
.insta-label{flex:1;text-align:left}
.insta-role{font-size:9.5px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,240,250,.80);margin-bottom:2px}
.insta-name{font-size:14px;font-weight:500;color:rgba(255,240,250,.95);letter-spacing:.06em}

.order-btn{
  width:100%;padding:20px 24px;min-height:60px;
  background:#E67E22;border:1.5px solid rgba(255,200,140,.50);border-radius:4px;
  font-family:var(--font-body);font-size:12px;font-weight:700;letter-spacing:.18em;
  text-transform:uppercase;color:#FFF;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:10px;
  box-shadow:0 4px 24px rgba(230,126,34,.55);
  -webkit-tap-highlight-color:transparent;position:relative;overflow:hidden;
  transition:background 180ms,transform 80ms;
}
.order-btn::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,200,140,.18) 0%,transparent 55%);pointer-events:none}
.order-btn:hover{background:#F08C32}
.order-btn:active{transform:scale(.976);background:#C86516}

.home-footer{padding:16px 0 28px;display:flex;align-items:center;justify-content:space-between;opacity:.38}
.footer-text{font-size:9px;font-weight:400;letter-spacing:.16em;text-transform:uppercase;color:var(--parchment)}

.anim{animation:fadeUp 600ms var(--ease-out) both}
.d1{animation-delay:60ms}.d2{animation-delay:160ms}.d3{animation-delay:240ms}
.d4{animation-delay:330ms}.d5{animation-delay:420ms}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

/* CONV SCREEN */
#convScreen{
  position:fixed;inset:0;z-index:200;
  display:flex;flex-direction:column;
  background:#0f0404;
  transform:translateY(100%);
  transition:transform 400ms var(--ease-out);
  overflow:hidden;
}
#convScreen.visible{transform:translateY(0)}

.conv-head{
  flex-shrink:0;
  z-index:10;
  background:rgba(15,4,4,.98);
  backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(230,126,34,.18);
}
.conv-head-inner{
  max-width:640px;margin:0 auto;padding:0 16px;
  height:56px;display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.conv-brand{display:flex;align-items:center;gap:10px;cursor:pointer}
.conv-logo{
  width:32px;height:32px;border-radius:50%;
  background:radial-gradient(circle at 38% 34%,#6E1212 0%,#2E0505 70%);
  border:1.5px solid rgba(230,126,34,.65);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-size:14px;font-weight:600;font-style:italic;color:var(--off-white);
}
.conv-brand-name{font-family:var(--font-display);font-size:17px;font-weight:600;font-style:italic;color:var(--off-white);line-height:1}
.conv-brand-status{font-size:10px;font-weight:500;color:rgba(242,156,74,.7);letter-spacing:.04em}
.conv-progbar{width:90px;height:2px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden}
.conv-progfill{height:100%;background:var(--primary-glow);border-radius:2px;transition:width .5s var(--ease-io)}

.cart-btn{
  position:relative;
  width:40px;height:40px;border-radius:10px;
  background:rgba(230,126,34,.12);
  border:1.5px solid rgba(230,126,34,.28);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;
  transition:background .15s,border-color .15s,transform .1s;
  -webkit-tap-highlight-color:transparent;
}
.cart-btn:hover{background:rgba(230,126,34,.22);border-color:rgba(230,126,34,.5)}
.cart-btn:active{transform:scale(.93)}
.cart-badge{
  position:absolute;top:-5px;right:-5px;
  min-width:18px;height:18px;border-radius:9px;
  background:#E67E22;border:2px solid rgba(15,4,4,.98);
  display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;color:#fff;
  line-height:1;padding:0 3px;
  transform:scale(0);transition:transform .2s cubic-bezier(.2,.7,.2,1);
}
.cart-badge.show{transform:scale(1)}

.conv-scroll{
  flex:1 1 0;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  padding-bottom:8px;
}
.conv-stage{
  max-width:640px;margin:0 auto;
  padding:24px 16px 16px;
  display:flex;flex-direction:column;
}

.msg{
  display:flex;align-items:flex-start;gap:10px;
  margin-bottom:12px;
  animation:msgIn .38s cubic-bezier(.2,.7,.2,1) both;
}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg-avatar{
  width:32px;height:32px;border-radius:50%;flex-shrink:0;
  background:radial-gradient(circle at 38% 34%,#6E1212 0%,#2E0505 70%);
  border:1.5px solid rgba(230,126,34,.65);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-size:13px;font-weight:600;font-style:italic;color:var(--off-white);
  margin-top:2px;flex-shrink:0;
}
.msg-bubble{
  max-width:72ch;padding:11px 15px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.10);
  border-radius:4px 16px 16px 16px;
  font-size:15px;line-height:1.6;color:rgba(255,255,255,.88);
}
.msg-bubble strong{color:#fff;font-weight:700}
.msg-bubble em{font-style:italic;color:var(--primary-glow)}

.typing{display:flex;align-items:center;gap:10px;margin-bottom:12px;animation:msgIn .3s ease both}
.typing-dots{
  display:flex;gap:4px;align-items:center;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.10);
  padding:10px 14px;border-radius:16px;
}
.typing-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.3);animation:dotPulse 1.2s ease-in-out infinite}
.typing-dot:nth-child(2){animation-delay:.2s}
.typing-dot:nth-child(3){animation-delay:.4s}
@keyframes dotPulse{0%,80%,100%{transform:scale(.8);opacity:.4}40%{transform:scale(1.1);opacity:1}}

.user-msg{display:flex;justify-content:flex-end;margin-bottom:12px;animation:msgIn .3s ease both}
.user-bubble{
  max-width:72ch;padding:10px 15px;
  background:var(--primary-deep);
  border-radius:16px 4px 16px 16px;
  font-size:14px;line-height:1.55;color:#fff;font-weight:500;
}

.inline-block{
  margin-bottom:16px;
  animation:msgIn .38s cubic-bezier(.2,.7,.2,1) both;
}

.answer-area{
  flex-shrink:0;
  z-index:50;
  background:rgba(10,4,4,.98);
  backdrop-filter:blur(20px);
  border-top:1px solid rgba(230,126,34,.15);
  padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));
}
.answer-inner{
  max-width:640px;margin:0 auto;
  display:flex;flex-direction:column;gap:8px;
}
.answer-hint{
  font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:rgba(255,255,255,.28);
}

.input-row{display:flex;gap:10px;align-items:flex-end}
.text-input{
  flex:1;padding:11px 14px;
  background:rgba(255,255,255,.07);
  border:1.5px solid rgba(255,255,255,.14);
  border-radius:10px;color:#fff;
  font-family:var(--font-body);font-size:16px;
  outline:none;transition:border-color .18s,background .18s;
  resize:none;line-height:1.5;
}
.text-input::placeholder{color:rgba(255,255,255,.25)}
.text-input:focus{border-color:rgba(230,126,34,.55);background:rgba(255,255,255,.09)}
.send-btn{
  width:44px;height:44px;border-radius:10px;
  background:var(--primary);border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:background .15s,transform .12s;
  box-shadow:0 4px 12px rgba(230,126,34,.4);
}
.send-btn:hover{background:var(--primary-glow)}
.send-btn:active{transform:scale(.93)}

.continue-btn{
  align-self:flex-start;
  display:inline-flex;align-items:center;gap:8px;
  padding:11px 20px;
  background:linear-gradient(105deg,#C86516 0%,#E67E22 30%,#F29C4A 52%,#E67E22 72%,#C86516 100%);
  background-size:250% 100%;background-position:100% 0;
  border:1px solid rgba(253,243,234,.28);border-radius:6px;
  font-family:var(--font-body);font-size:13px;font-weight:700;
  color:#fff;cursor:pointer;
  transition:background-position .5s ease,transform .12s,opacity .2s;
  box-shadow:0 4px 14px rgba(230,126,34,.38);
  -webkit-tap-highlight-color:transparent;
}
.continue-btn:hover{background-position:0% 0}
.continue-btn:active{transform:scale(.97)}

.carousel-section{margin-bottom:14px}
.carousel-label{
  font-size:9px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;
  color:var(--primary-glow);margin-bottom:10px;
  padding-left:42px;
}
.carousel{
  display:flex;gap:14px;
  overflow-x:auto;overflow-y:visible;
  scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;
  padding:4px 16px 16px 42px;
  scrollbar-width:none;
  box-sizing:border-box;
  width:100%;
}
.carousel::-webkit-scrollbar{display:none}

.product-card{
  scroll-snap-align:start;
  flex:0 0 178px;
  background:#1C0808;
  border:1.5px solid rgba(255,255,255,.10);
  border-radius:14px;
  overflow:hidden;
  cursor:pointer;
  transition:border-color .2s,transform .15s,box-shadow .2s;
  -webkit-tap-highlight-color:transparent;
  position:relative;
  box-shadow:0 4px 16px rgba(0,0,0,.45);
  display:flex;
  flex-direction:column;
}
.product-card:active{transform:scale(.96);box-shadow:0 2px 8px rgba(0,0,0,.5)}
.product-card.sel{
  border-color:var(--green-light);
  box-shadow:0 0 0 2px rgba(34,197,94,.28), 0 4px 20px rgba(34,197,94,.15);
}

.card-check{
  position:absolute;top:8px;right:8px;
  width:22px;height:22px;border-radius:50%;
  background:var(--green-sel);border:2px solid var(--green-light);
  display:none;align-items:center;justify-content:center;z-index:3;
  box-shadow:0 2px 8px rgba(34,197,94,.4);
}
.product-card.sel .card-check{display:flex}

.card-img-wrap{
  position:relative;
  width:100%;
  height:128px;
  overflow:hidden;
  flex-shrink:0;
}
.card-img{
  width:100%;height:100%;
  object-fit:cover;
  display:block;
  transition:transform .35s ease;
}
.product-card:hover .card-img{transform:scale(1.06)}
.card-img-placeholder{
  width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#2A0A0A 0%,#3D1010 50%,#1E0606 100%);
  font-size:44px;
  position:relative;
}
.card-img-placeholder::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(230,126,34,.08) 0%,transparent 60%);
}
.card-img-wrap::after{
  content:'';position:absolute;bottom:0;left:0;right:0;
  height:36px;
  background:linear-gradient(to top,rgba(28,8,8,.9) 0%,transparent 100%);
  pointer-events:none;z-index:1;
}

.card-badge{
  position:absolute;top:7px;left:7px;
  background:rgba(230,126,34,.92);
  color:#fff;font-size:9px;font-weight:700;letter-spacing:.08em;
  padding:2px 7px;border-radius:100px;
  text-transform:uppercase;z-index:2;
  backdrop-filter:blur(4px);
}

.card-body{
  padding:10px 11px 12px;
  display:flex;flex-direction:column;gap:4px;
  flex:1;
  background:#1C0808;
}
.card-name{
  font-family:var(--font-body);
  font-size:13.5px;font-weight:700;
  color:#fff;line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.card-desc{
  font-size:11px;color:rgba(255,255,255,.42);
  line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.card-footer{
  display:flex;align-items:center;justify-content:space-between;
  margin-top:auto;padding-top:7px;
}
.card-price{
  font-family:var(--font-strong);
  font-size:16px;font-weight:700;
  color:var(--primary-glow);
  letter-spacing:.02em;
  line-height:1;
}
.card-price-label{
  font-size:9px;color:rgba(255,255,255,.3);font-weight:500;
  letter-spacing:.06em;margin-bottom:1px;
}

/* ════════════════════════════════
   MODAL DE CONFIGURAÇÃO DO PRODUTO
════════════════════════════════ */
.cfg-modal-overlay{
  position:fixed;inset:0;z-index:600;
  background:rgba(8,2,2,.78);
  backdrop-filter:blur(7px);
  display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;
  transition:opacity .25s ease;
}
.cfg-modal-overlay.open{opacity:1;pointer-events:all}

.cfg-modal{
  width:100%;max-width:520px;
  background:#1A0606;
  border-radius:22px 22px 0 0;
  border:1.5px solid rgba(230,126,34,.25);
  border-bottom:none;
  overflow:hidden;
  transform:translateY(100%);
  transition:transform .34s cubic-bezier(.2,.7,.2,1);
  box-shadow:0 -10px 48px rgba(0,0,0,.65);
  max-height:92dvh;
  display:flex;flex-direction:column;
}
.cfg-modal-overlay.open .cfg-modal{transform:translateY(0)}

.cfg-modal-handle{
  width:40px;height:4px;border-radius:2px;
  background:rgba(255,255,255,.18);
  margin:12px auto 0;flex-shrink:0;
}
.cfg-modal-close{
  position:absolute;top:12px;right:14px;
  width:32px;height:32px;border-radius:50%;
  background:rgba(255,255,255,.1);border:none;
  color:rgba(255,255,255,.65);font-size:17px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;z-index:5;
  transition:background .15s;
  -webkit-tap-highlight-color:transparent;
}
.cfg-modal-close:hover{background:rgba(255,255,255,.2)}

.cfg-modal-img-wrap{
  position:relative;width:100%;height:260px;flex-shrink:0;overflow:hidden;
}
.cfg-modal-img{width:100%;height:100%;object-fit:cover;display:block}
.cfg-modal-img-placeholder{
  width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#2A0A0A,#3D1010);
  font-size:80px;
}
.cfg-modal-img-wrap::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:90px;
  background:linear-gradient(to top,#1A0606 0%,transparent 100%);
  pointer-events:none;
}

.cfg-modal-body{
  padding:14px 20px 0;
  overflow-y:auto;flex:1;
  padding-bottom:0;
}
.cfg-modal-name{

function itemKey(itemId, cat, variant, obs){
  return [itemId, cat, variant||'', (obs||'').trim()].join('||');

function cartTotal(){
  let sum = 0;
  st.cart.forEach(i=>{ if(i.priceNum) sum += i.priceNum * (i.qty||1); });
  return sum;
}

function openConv(){
  st={ nome:'', cart:[], delivery:'', payment:'', address:'', addrRef:'' };
  _uidCounter=0;
  document.getElementById('convStage').innerHTML='';
  document.getElementById('answerInner').innerHTML='';
  document.getElementById('answerArea').style.display='none';
  document.getElementById('progFill').style.width='0%';
  updateCartUI();

  const home=document.getElementById('homeScreen');
  const conv=document.getElementById('convScreen');
  home.classList.add('exiting');
  conv.style.display='flex';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    conv.classList.add('visible');
    document.body.style.overflow='hidden';
  }));
  setTimeout(()=>{ home.style.visibility='hidden'; },300);
  setTimeout(()=>startFlow(), 380);
}

function closeConv(){
  const home=document.getElementById('homeScreen');
  const conv=document.getElementById('convScreen');
  conv.classList.remove('visible');
  home.style.visibility='';
  home.classList.remove('exiting');
  document.body.style.overflow='';
  setTimeout(()=>{ conv.style.display=''; },430);
}

function updateCartUI(){
  // Conta total de unidades (somando qty)
  const totalQty = st.cart.reduce((s,i)=>s+(i.qty||1),0);
  const badge = document.getElementById('cartBadge');
  const countLabel = document.getElementById('cartCountLabel');
  if(badge){
    badge.textContent = totalQty;
    badge.classList.toggle('show', totalQty>0);
  }
  if(countLabel) countLabel.textContent = totalQty+' '+(totalQty===1?'item':'itens');
}

function openCart(){
  renderCartDrawer();
  document.getElementById('cartOverlay').classList.add('open');
}
function closeCart(){
  document.getElementById('cartOverlay').classList.remove('open');
}
function closeCartOutside(e){
  if(e.target===document.getElementById('cartOverlay')) closeCart();
}

function renderCartDrawer(){
  const scroll = document.getElementById('cartScroll');
  const footer = document.getElementById('cartFooter');
  scroll.innerHTML='';

  if(!st.cart.length){
    scroll.innerHTML=`<div class="cart-empty"><div class="cart-empty-icon">🛒</div><div class="cart-empty-text">Sacola vazia</div></div>`;
    footer.style.display='none';
    return;
  }

  footer.style.display='';
  st.cart.forEach(ci=>{
    const qty = ci.qty||1;
    const div=document.createElement('div'); div.className='cart-item';
    const fallbackEmoji = {principal:'🍔',acompanhamentos:'🍟',sobremesas:'🍰',bebidas:'🥤'}[ci.cat]||'🍽️';
    const itemTotal = ci.priceNum ? 'R$ '+(ci.priceNum*qty).toFixed(2).replace('.',',') : ci.priceStr;
    div.innerHTML=`
      <div class="cart-item-img">
        ${ci.item.img?`<img src="${esc(ci.item.img)}" alt="${esc(ci.item.name)}" loading="lazy" onerror="this.parentElement.textContent='${fallbackEmoji}'">`:`${fallbackEmoji}`}
      </div>
      <div class="cart-item-info">
        <div class="cart-item-name">${qty>1?`<strong>${qty}x</strong> `:''}${esc(ci.item.name)}</div>
        ${ci.variant?`<div class="cart-item-variant">${esc(ci.variant)}</div>`:''}
        ${ci.obs?`<div class="cart-item-obs">📝 ${esc(ci.obs)}</div>`:''}
        <div class="cart-item-price">${esc(itemTotal)}</div>
      </div>
      <div class="cart-item-actions">
        <button class="cart-item-edit" onclick="editCartItem('${ci.uid}')">✏️ Editar</button>
        <button class="cart-item-remove" onclick="removeCartItem('${ci.uid}')">✕ Remover</button>
      </div>`;
    scroll.appendChild(div);
  });

  const total = cartTotal();
  const totalEl = document.getElementById('cartTotalValue');
  if(total>0) totalEl.textContent='R$ '+total.toFixed(2).replace('.',',');
  else totalEl.textContent='—';
  updateCartUI();
}

function removeCartItem(uid){
  st.cart = st.cart.filter(i=>i.uid!==uid);
  refreshCardStates();
  updateCartUI();
  renderCartDrawer();
  showToast('Item removido da sacola');
}

function editCartItem(uid){
  const ci = st.cart.find(i=>i.uid===uid);
  if(!ci) return;
  closeCart();
  setTimeout(()=> openCfgModal(ci.item, ci.cat, ci.uid), 200);
}

function refreshCardStates(){
  document.querySelectorAll('.product-card').forEach(card=>{
    const id = card.id.replace('card-','');
    const inCart = st.cart.some(i=>i.itemId===id);
    card.classList.toggle('sel', inCart);
  });
}

let _cfgItem=null, _cfgCat=null, _cfgEditUid=null;
let _cfgSelectedVariant=null, _cfgObs='', _cfgQty=1;

function openCfgModal(item, cat, editUid=null){
  _cfgItem=item; _cfgCat=cat; _cfgEditUid=editUid;
  _cfgSelectedVariant=null; _cfgObs=''; _cfgQty=1;

  if(editUid){
    // Edição explícita: carrega estado do item existente
    const ci = st.cart.find(i=>i.uid===editUid);
    if(ci){
      _cfgSelectedVariant = ci.variant||null;
      _cfgObs = ci.obs||'';
      _cfgQty = ci.qty||1;
    }
  }
  // Para novo item: sempre abre limpo (qty=1), permitindo nova entrada na sacola

  renderCfgModal();
  document.getElementById('cfgModalOverlay').classList.add('open');
}

function renderCfgModal(){
  const item = _cfgItem;
  const content = document.getElementById('cfgModalContent');
  const isEdit = !!_cfgEditUid;

  let imgHtml = item.img
    ? `<img class="cfg-modal-img" src="${esc(item.img)}" alt="${esc(item.name)}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
    : '';
  const fallbackEmoji = {principal:'🍔',acompanhamentos:'🍟',sobremesas:'🍰',bebidas:'🥤'}[_cfgCat]||'🍽️';

  let variantsHTML = '';
  if(item.variants && item.variants.length){
    variantsHTML = `<div class="cfg-section-title">Escolha o tamanho</div>
    <div class="cfg-variant-list" id="cfgVariantList">
      ${item.variants.map(({v,price})=>`
        <div class="cfg-variant-item${_cfgSelectedVariant===v?' sel':''}" data-v="${esc(v)}" data-price="${esc(price)}" onclick="selectVariant('${esc(v)}','${esc(price)}')">
          <div class="cfg-variant-check">
            ${_cfgSelectedVariant===v?`<svg width="10" height="10" viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-5" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`:''}
          </div>
          <div class="cfg-variant-label">${esc(v)}</div>
          <div class="cfg-variant-price">${esc(price)}</div>
        </div>`).join('')}
    </div>`;
  }

  let ingredHTML = '';
  if(item.ingredients && item.ingredients.length){
    ingredHTML = `<div class="cfg-section-title">Ingredientes</div>
    <div class="cfg-ingredients">
      ${item.ingredients.map(i=>`<span class="cfg-ingredient">${esc(i)}</span>`).join('')}
    </div>`;
  }

  const displayPrice = (_cfgSelectedVariant && item.variants)
    ? (item.variants.find(v=>v.v===_cfgSelectedVariant)||{}).price || item.price
    : item.price;

  // ITEM 1: controle de quantidade
  const qtyHTML = `
    <div class="cfg-qty-row" style="margin-top:14px">
      <div class="cfg-qty-label">Quantidade</div>
      <div class="cfg-qty-controls">
        <button class="cfg-qty-btn" onclick="changeQty(-1)" aria-label="Diminuir">−</button>
        <div class="cfg-qty-val" id="cfgQtyVal">${_cfgQty}</div>
        <button class="cfg-qty-btn" onclick="changeQty(1)" aria-label="Aumentar">+</button>
      </div>
    </div>`;

/* ITEM 1: alterar quantidade no modal */
function changeQty(delta){
  _cfgQty = Math.max(1, (_cfgQty||1) + delta);
  const el = document.getElementById('cfgQtyVal');
  if(el) el.textContent = _cfgQty;
}

/* ITEM 1: "Adicionar mais uma unidade" ao grupo existente */
function cfgAddOneMore(){
  const item = _cfgItem;
  const cat = _cfgCat;

  if(item.variants && item.variants.length && !_cfgSelectedVariant){
    showToast('Escolha um tamanho primeiro ☝️');
    return;
  }

  const obsInput = document.getElementById('cfgObsInput');
  const obs = obsInput ? obsInput.value.trim() : '';

  let priceNum = item.priceNum||0;
  let priceStr = item.price;
  let variantLabel = _cfgSelectedVariant||'';
  if(variantLabel && item.variants){
    const vObj = item.variants.find(v=>v.v===variantLabel);
    if(vObj){ priceNum=vObj.priceNum||0; priceStr=vObj.price; }
  }

  const key = itemKey(item.id, cat, variantLabel, obs);

  // Procura grupo existente com mesma configuração
  const existing = st.cart.find(i=> itemKey(i.itemId, i.cat, i.variant||'', i.obs||'') === key);

  if(existing){
    // Incrementa quantidade no grupo existente
    existing.qty = (existing.qty||1) + 1;
    showToast(`+1 ${item.name} (${existing.qty}x no total) 🛒`);
  } else {
    // Primeira vez: cria com qty=1
    const label = item.name + (variantLabel?' ('+variantLabel+')':'');
    st.cart.push({
      uid: newUid(), cat, itemId:item.id, item,
      variant:variantLabel, obs, label, priceNum, priceStr, qty:1
    });
    showToast(`${item.name} adicionado 🛒`);
  }

  refreshCardStates();
  updateCartUI();
  closeCfgModalBtn();
}

function cfgRemove(){
  const uid = _cfgEditUid;
  if(uid){
    st.cart = st.cart.filter(i=>i.uid!==uid);
  }
  refreshCardStates();
  updateCartUI();
  closeCfgModalBtn();
  showToast('Removido da sacola');
}

function selectVariant(v, price){
  _cfgSelectedVariant = v;
  document.querySelectorAll('.cfg-variant-item').forEach(el=>{
    const isThis = el.dataset.v===v;
    el.classList.toggle('sel',isThis);
    el.querySelector('.cfg-variant-check').innerHTML = isThis
      ? `<svg width="10" height="10" viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-5" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`
      : '';
  });
  const priceEl = document.getElementById('cfgModalPrice');
  if(priceEl) priceEl.textContent = price;
}

/* cfgConfirm: "Adicionar ao pedido" (respeita _cfgQty) ou "Salvar alterações" */
function cfgConfirm(){
  const item = _cfgItem;
  const cat = _cfgCat;
  const obsInput = document.getElementById('cfgObsInput');
  const obs = obsInput ? obsInput.value.trim() : '';

  if(item.variants && item.variants.length && !_cfgSelectedVariant){
    showToast('Escolha um tamanho ☝️');
    return;
  }

  let priceNum = item.priceNum||0;
  let priceStr = item.price;
  let variantLabel = _cfgSelectedVariant||'';
  if(variantLabel && item.variants){
    const vObj = item.variants.find(v=>v.v===variantLabel);
    if(vObj){ priceNum=vObj.priceNum||0; priceStr=vObj.price; }
  }

  const label = item.name + (variantLabel?' ('+variantLabel+')':'');
  const qty = _cfgQty || 1;

  if(_cfgEditUid){
    // Edição: atualiza item existente
    const idx = st.cart.findIndex(i=>i.uid===_cfgEditUid);
    if(idx>=0){
      st.cart[idx] = {...st.cart[idx], variant:variantLabel, obs, label, priceNum, priceStr, qty};
    }
    showToast('Item atualizado ✓');
  } else {
    // Novo item: verifica se já existe grupo com mesma config
    const key = itemKey(item.id, cat, variantLabel, obs);
    const existing = st.cart.find(i=> itemKey(i.itemId, i.cat, i.variant||'', i.obs||'') === key);
    if(existing){
      existing.qty = (existing.qty||1) + qty;
      showToast(`${existing.qty}x ${item.name} na sacola 🛒`);
    } else {
      st.cart.push({
        uid: newUid(), cat, itemId:item.id, item,
        variant:variantLabel, obs, label, priceNum, priceStr, qty
      });
      showToast(qty>1?`${qty}x ${item.name} adicionado 🛒`:'Adicionado à sacola 🛒');
    }
  }

  refreshCardStates();
  updateCartUI();
  closeCfgModalBtn();
}

function closeCfgModal(e){
  if(e.target===document.getElementById('cfgModalOverlay')) closeCfgModalBtn();
}
function closeCfgModalBtn(){
  document.getElementById('cfgModalOverlay').classList.remove('open');
}

function addUser(text){

/* ITEM 2: addUserWithCartCards — exibe o texto + cards clicáveis dos itens da sacola no histórico */
function addUserWithCartCards(text, cartSnapshot){
  const el=document.createElement('div');
  el.style.display='flex'; el.style.flexDirection='column'; el.style.alignItems='flex-end';
  el.style.marginBottom='12px'; el.style.animation='msgIn .3s ease both';

  // Bubble de texto principal
  const bubble=document.createElement('div'); bubble.className='user-bubble';
  bubble.style.marginBottom='6px';

  // Monta chips clicáveis de cada item
  const chips = cartSnapshot.map(ci=>{
    const qty = ci.qty||1;
    const chipText = (qty>1?qty+'x ':'')+ci.item.name+(ci.variant?' ('+ci.variant+')':'');
    return `<span class="history-card-item" onclick="openCfgModal_byUid('${ci.uid}')">
      <span class="history-card-dot"></span>${esc(chipText)}
    </span>`;
  }).join('');

  bubble.innerHTML = `${esc(text)}<br><div style="margin-top:7px;display:flex;flex-wrap:wrap;gap:4px;">${chips}</div>`;
  el.appendChild(bubble);
  stage().appendChild(el);
  scrollBottom();
}

/* ITEM 2: abre modal de edição a partir do uid (usado pelos chips do histórico) */
function openCfgModal_byUid(uid){
  const ci = st.cart.find(i=>i.uid===uid);
  if(!ci){ showToast('Item não encontrado na sacola'); return; }
  openCfgModal(ci.item, ci.cat, uid);
}

function addInline(buildFn){
  const el=document.createElement('div'); el.className='inline-block';
  buildFn(el);
  stage().appendChild(el); scrollBottom();
  return el;
}

function send(msgs, done){
  let t=0;
  msgs.forEach((m,i)=>{
    const delay=m.delay||0;
    if(i>0) setTimeout(()=>showTyping(), delay);
    const at=delay+(i>0?800:0);
    t=at+200;
    setTimeout(()=>addBot(m.html), at);
  });
  setTimeout(()=>done&&done(), t+80);
}

function renderAnswer(buildFn){
  const inner=document.getElementById('answerInner');
  inner.innerHTML='';
  buildFn(inner);
  const area=document.getElementById('answerArea');
  area.style.display='';
  area.style.opacity='1';
  area.style.pointerEvents='auto';
  scrollBottom();
}
function clearAnswer(){
  const area=document.getElementById('answerArea');
  area.style.opacity='0';
  area.style.pointerEvents='none';
  setTimeout(()=>{ area.style.display='none'; document.getElementById('answerInner').innerHTML=''; },180);
}

function stage(){ return document.getElementById('convStage'); }
function scrollBottom(){
  setTimeout(()=>{
    const sc=document.getElementById('convScroll');
    if(sc) sc.scrollTo({top:sc.scrollHeight,behavior:'smooth'});
  },60);
}

          const lines = items.map(i=>{
            const qty = i.qty||1;
            const prefix = qty>1 ? qty+'x ' : '';
            return prefix+i.label+(i.obs?'\n  📝 '+i.obs:'');
          });
          rows.push({k:label, v:lines.join('\n')});
        }
      });

      rows.push({k:'Recebimento',v:st.delivery==='entrega'?'Entrega':'Retirada no local'});
      if(st.delivery==='entrega'&&st.address) rows.push({k:'Endereço',v:st.address+(st.addrRef?' — '+st.addrRef:'')});
      rows.push({k:'Pagamento',v:{pix:'PIX',cartao:'Cartão',dinheiro:'Dinheiro'}[st.payment]});

      const total=cartTotal();
      if(total>0) rows.push({k:'Total est.',v:'R$ '+total.toFixed(2).replace('.',',')});

      card.innerHTML=rows.map(r=>`<div class="summary-row"><div class="summary-k">${esc(r.k)}</div><div class="summary-v">${esc(r.v)}</div></div>`).join('');
      el.appendChild(card);

      const wa=document.createElement('button'); wa.className='wa-btn';
      wa.innerHTML=`<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M13.601 2.326A7.854 7.854 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.933 7.933 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.898 7.898 0 0 0 13.6 2.326zM7.994 14.521a6.573 6.573 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.557 6.557 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592zm3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.114-.198-.011-.304.088-.403.087-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.34-.114-.007-.247-.007-.38-.007a.729.729 0 0 0-.529.247c-.182.198-.691.677-.691 1.654 0 .977.71 1.916.81 2.049.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.114-.943-.049-.084-.182-.133-.38-.232z" fill="#FFF"/></svg> Finalizar no WhatsApp`;
      wa.onclick=sendWA;
      el.appendChild(wa);

      const ed=document.createElement('button'); ed.className='action-btn ghost'; ed.style.marginTop='8px';
      ed.textContent='✏️ Editar pedido';
      ed.onclick=()=>{
        el.style.display='none';
        st.cart=[]; st.delivery=''; st.payment='';
        refreshCardStates(); updateCartUI();
        setTimeout(()=>{ send([{html:'Sem problema! Vamos recomeçar 😊 Escolha o principal:', delay:0}], ()=>stepPrincipal()); },300);
      };
      el.appendChild(ed);
      prog(100);
    });
  });
}

/* ════════════════════════════════
   CARROSSEL
════════════════════════════════ */
function buildCarousel(container, cat, sections){
  sections.forEach(section=>{
    const sec=document.createElement('div'); sec.className='carousel-section';

    const lbl=document.createElement('div'); lbl.className='carousel-label';
    lbl.textContent=section.title;
    sec.appendChild(lbl);

    const car=document.createElement('div'); car.className='carousel';

    section.items.forEach(item=>{
      const card=document.createElement('div');
      card.className='product-card'; card.id='card-'+item.id;

      const fallbackEmoji = {principal:'🍔',acompanhamentos:'🍟',sobremesas:'🍰',bebidas:'🥤'}[cat]||'🍽️';
      const inCart = st.cart.some(i=>i.itemId===item.id&&i.cat===cat);
      if(inCart) card.classList.add('sel');

      const imgHtml = item.img
        ? `<img class="card-img" src="${esc(item.img)}" alt="${esc(item.name)}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
        : '';
      const placeholderStyle = item.img ? 'style="display:none"' : '';

      card.innerHTML=`
        <div class="card-check">
          <svg width="10" height="10" viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-5" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="card-img-wrap">
          ${imgHtml}
          <div class="card-img-placeholder" ${placeholderStyle}>${fallbackEmoji}</div>
          ${section.badge?`<div class="card-badge">${esc(section.badge)}</div>`:''}
        </div>
        <div class="card-body">
          <div class="card-name">${esc(item.name)}</div>
          <div class="card-desc">${esc(item.desc)}</div>
          <div class="card-footer">
            <div>
              ${item.variants?'<div class="card-price-label">A partir de</div>':''}
              <div class="card-price">${esc(item.price)}</div>
            </div>
          </div>
        </div>`;

      card.addEventListener('click', ()=> openCfgModal(item, cat));
      car.appendChild(card);
    });

    sec.appendChild(car);
    container.appendChild(sec);
  });
}

function lock(id){
  const el=document.getElementById(id);
  if(el){el.style.pointerEvents='none';el.style.opacity='.55';}
}

/* ════════════════════════════════
   WHATSAPP
════════════════════════════════ */
function sendWA(){
  const payL={pix:'PIX',cartao:'Cartão',dinheiro:'Dinheiro'};
  let msg=`Olá, Famiglia Zanole! 🍔\n\nMeu nome é *${st.nome}* e gostaria de fazer um pedido.\n`;

  const cats=[
    {cat:'principal',icon:'🍔',label:'Principal'},
    {cat:'acompanhamentos',icon:'🍟',label:'Acompanhamentos'},
    {cat:'sobremesas',icon:'🍰',label:'Sobremesas'},
    {cat:'bebidas',icon:'🥤',label:'Bebidas'},
  ];
  cats.forEach(({cat,icon,label})=>{
    const items=st.cart.filter(i=>i.cat===cat);
    if(items.length){
      msg+=`\n*${icon} ${label}:*\n`;
      items.forEach(i=>{
        const qty = i.qty||1;
        msg+='• '+(qty>1?qty+'x ':'')+i.label;
        if(i.obs) msg+=' (obs: '+i.obs+')';
        msg+='\n';
      });
    }
  });

  if(st.delivery==='entrega'){
    msg+=`\n*📦 Recebimento:* Entrega\n*Endereço:* ${st.address}`;
    if(st.addrRef) msg+=`\n*Referência:* ${st.addrRef}`;
  } else {
    msg+=`\n*📦 Recebimento:* Retirada no local`;
  }
  msg+=`\n\n*💳 Pagamento:* ${payL[st.payment]}`;

  const total=cartTotal();
  if(total>0) msg+=`\n*💰 Total estimado:* R$ ${total.toFixed(2).replace('.',',')}`;

  window.open(`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}`,'_blank');
  closeConv();
}

/* ════════════════════════════════
   UTILS
════════════════════════════════ */
function fn(){ return st.nome.split(' ')[0]; }
function esc(s){ if(!s&&s!==0)return''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

const toastEl=document.getElementById('toast');
let toastT;
function showToast(msg){
  toastEl.textContent=msg; toastEl.classList.add('on');
  clearTimeout(toastT); toastT=setTimeout(()=>toastEl.classList.remove('on'),2400);
}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(document.getElementById('cfgModalOverlay').classList.contains('open')) closeCfgModalBtn();
    else if(document.getElementById('cartOverlay').classList.contains('open')) closeCart();
    else if(document.getElementById('convScreen').classList.contains('visible')) closeConv();
  }
});
</script>
